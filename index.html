<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 p-6">

  <div class="max-w-5xl mx-auto bg-blue-900 text-white shadow-md rounded-lg p-6">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-semibold">Product Management</h1>
      <button onclick="openCreateModal()" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-600">
        Add Product
      </button>
    </div>

    <table class="w-full border-collapse border border-gray-300 bg-white text-black">
      <thead class="bg-gray-200">
        <tr class="text-center">
          <th class="border p-2">#</th>
          <th class="border p-2">Name</th>
          <th class="border p-2">Description</th>
          <th class="border p-2">Price</th>
          <th class="border p-2">Stock</th>
          <th class="border p-2">Actions</th>
        </tr>
      </thead>
      <tbody id="productTableBody"></tbody>
    </table>
  </div>

  <div id="productModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="bg-white rounded-lg w-96 p-6">
      <h2 id="modalTitle" class="text-xl font-semibold mb-4">Add Product</h2>

      <form id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="productId">

        <label class="block mb-2">Name</label>
        <input id="productName" type="text" required class="w-full border p-2 mb-3 rounded">

        <label class="block mb-2">Description</label>
        <input id="productDescription" type="text" required class="w-full border p-2 mb-3 rounded">

        <label class="block mb-2">Price</label>
        <input id="productPrice" type="number" step="0.01" required class="w-full border p-2 mb-3 rounded">

        <label class="block mb-2">Stock</label>
        <input id="productStock" type="number" required class="w-full border p-2 mb-3 rounded">

        <div class="flex justify-end gap-2 mt-4">
          <button type="button" onclick="closeModal()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
            Cancel
          </button>
          <button type="submit" class="bg-green-800 text-white px-4 py-2 rounded hover:bg-green-700">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
