<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-300 text-gray-800 font-sans min-h-screen">

<!-- LOGIN SECTION -->
<section id="loginSection" class="flex justify-center items-center h-screen">
  <div class="bg-green-900 p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-semibold mb-6 text-center text-white">Login</h2>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1 text-green-200">Username</label>
        <input type="text" id="loginUsername" class="w-full p-2 rounded border border-green-700 bg-green-100 text-black focus:outline-none focus:ring-2 focus:ring-green-400" required>
        <p id="loginUsernameError" class="text-red-500 text-sm mt-1 hidden"></p>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-green-200">Password</label>
        <input type="password" id="loginPassword" class="w-full p-2 rounded border border-green-700 bg-green-100 text-black focus:outline-none focus:ring-2 focus:ring-green-400" required>
        <p id="loginPasswordError" class="text-red-500 text-sm mt-1 hidden"></p>
      </div>
      <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white py-2 rounded-lg transition">Login</button>
      <p class="text-center text-sm mt-3 text-green-200">
        Don't have an account? 
        <span onclick="showRegister()" class="text-green-400 hover:underline cursor-pointer">Register here</span>
      </p>
      <p id="loginMessage" class="text-center text-sm mt-3 text-red-500"></p>
    </form>
  </div>
</section>

<!-- REGISTER SECTION -->
<section id="registerSection" class="hidden flex justify-center items-center h-screen">
  <div class="bg-green-900 p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-semibold mb-6 text-center text-white">Register</h2>
    <form id="registerForm" class="space-y-4" onsubmit="return validateRegisterForm()">
      <div>
        <label class="block text-sm font-medium mb-1 text-green-200">Username</label>
        <input type="text" id="registerUsername" class="w-full p-2 rounded border border-green-700 bg-green-100 text-black focus:outline-none focus:ring-2 focus:ring-green-400">
        <p id="usernameError" class="text-red-500 text-sm mt-1 hidden"></p>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-green-200">Password</label>
        <input type="password" id="registerPassword" class="w-full p-2 rounded border border-green-700 bg-green-100 text-black focus:outline-none focus:ring-2 focus:ring-green-400">
        <p id="passwordError" class="text-red-500 text-sm mt-1 hidden"></p>
      </div>
      <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white py-2 rounded-lg">Register</button>
      <p class="text-center text-sm mt-3 text-green-200">
        Already have an account? 
        <span onclick="showLogin()" class="text-green-400 hover:underline cursor-pointer">Login here</span>
      </p>
      <p id="registerMessage" class="text-center text-sm mt-3 text-red-500"></p>
    </form>
  </div>
</section>

<!-- DASHBOARD SECTION -->
<section id="dashboardSection" class="hidden max-w-7xl mx-auto px-6 py-12">
  <div class="flex justify-between items-center mb-10">
    <h1 class="text-4xl font-extrabold tracking-wide text-green-900">Car Management System</h1>
    <button onclick="logout()"
      class="bg-red-600 hover:bg-red-500 text-white font-semibold px-6 py-2.5 rounded-lg shadow-md">Logout</button>
  </div>

  <div class="flex justify-end mb-6">
    <button onclick="openCreateModal()"
      class="bg-green-700 hover:bg-green-800 text-white font-semibold px-6 py-2.5 rounded-lg shadow-md">
      + Add Car
    </button>
  </div>

  <div class="bg-green-50 border border-green-700 rounded-2xl shadow-lg p-6 overflow-x-auto">
    <table class="min-w-full text-sm text-left border-collapse">
      <thead class="bg-green-900 text-white uppercase tracking-wide text-xs">
        <tr>
          <th class="px-6 py-3">No.</th>
          <th class="px-6 py-3">License Plate</th>
          <th class="px-6 py-3">Make</th>
          <th class="px-6 py-3">Model</th>
          <th class="px-6 py-3">Year</th>
          <th class="px-6 py-3">Color</th>
          <th class="px-6 py-3">Body Type</th>
          <th class="px-6 py-3">Engine Type</th>
          <th class="px-6 py-3">Transmission</th>
          <th class="px-6 py-3 text-center">Actions</th>
        </tr>
      </thead>
      <tbody id="carTableBody" class="divide-y divide-green-700 bg-green-50"></tbody>
    </table>
  </div>

 <!-- Car Modal -->
<div id="carModal" class="hidden fixed inset-0 bg-black/30 flex items-center justify-center z-50 p-4 overflow-auto">
  <div class="bg-green-900 rounded-2xl shadow-lg w-full max-w-lg p-6 relative flex flex-col max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-6">
      <h2 id="modalTitle" class="text-2xl font-bold text-green-100">Add Car</h2>
      <button onclick="closeModal()" class="text-green-100 font-bold text-xl hover:text-green-700">&times;</button>
    </div>
    <form id="carForm" class="space-y-4" onsubmit="saveCar(event)">
      <input type="hidden" id="carId">
      <div>
        <label class="block mb-1 font-medium text-green-100">License Plate</label>
        <input id="licensePlateNumber" class="w-full px-3 py-2 rounded border border-green-700 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
      </div>
      <div>
        <label class="block mb-1 font-medium text-green-100">Make</label>
        <input id="make" class="w-full px-3 py-2 rounded border border-green-700 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
      </div>
      <div>
        <label class="block mb-1 font-medium text-green-100">Model</label>
        <input id="model" class="w-full px-3 py-2 rounded border border-green-700 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
      </div>
      <div>
        <label class="block mb-1 font-medium text-green-100">Year</label>
        <input id="year" type="number" class="w-full px-3 py-2 rounded border border-green-700 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
      </div>
      <div>
        <label class="block mb-1 font-medium text-green-100">Color</label>
        <input id="color" class="w-full px-3 py-2 rounded border border-green-700 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
      </div>
      <div>
        <label class="block mb-1 font-medium text-green-100">Body Type</label>
        <input id="bodyType" class="w-full px-3 py-2 rounded border border-green-700 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
      </div>
      <div>
        <label class="block mb-1 font-medium text-green-100">Engine Type</label>
        <input id="engineType" class="w-full px-3 py-2 rounded border border-green-700 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
      </div>
      <div>
        <label class="block mb-1 font-medium text-green-100">Transmission</label>
        <input id="transmission" class="w-full px-3 py-2 rounded border border-green-700 focus:ring-2 focus:ring-green-400 focus:outline-none" required>
      </div>
      <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t border-green-700">
        <button type="button" onclick="closeModal()" class="bg-green-300 hover:bg-green-400 text-green-900 font-medium px-4 py-2 rounded-lg w-full sm:w-auto">Cancel</button>
        <button type="submit" class="bg-green-700 hover:bg-green-800 text-white font-medium px-4 py-2 rounded-lg shadow-md w-full sm:w-auto">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Link external JS -->
<script src="js/main.js"></script>
</body>
</html>
