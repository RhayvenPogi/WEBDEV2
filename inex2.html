<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Car Management System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const apiCars = "http://localhost:7070/api/cars";

    function App() {
        const [cars, setCars] = React.useState([]);
        const [showModal, setShowModal] = React.useState(false);
        const [editingCar, setEditingCar] = React.useState(null);
        const [form, setForm] = React.useState({
            licensePlateNumber: "",
            make: "",
            model: "",
            year: "",
            color: "",
            bodyType: "",
            engineType: "",
            transmission: ""
        });
        const [formErrors, setFormErrors] = React.useState({});

        React.useEffect(() => {
            fetchCars();
        }, []);

        function fetchCars() {
            fetch(apiCars)
                .then(res => res.json())
                .then(data => setCars(data))
                .catch(() => alert("Failed to load cars."));
        }

        function openCreateModal() {
            setEditingCar(null);
            setForm({
                licensePlateNumber: "",
                make: "",
                model: "",
                year: "",
                color: "",
                bodyType: "",
                engineType: "",
                transmission: ""
            });
            setFormErrors({});
            setShowModal(true);
        }

        function openEditModal(car) {
            setEditingCar(car);
            setForm(car);
            setFormErrors({});
            setShowModal(true);
        }

        function closeModal() {
            setShowModal(false);
        }

        function handleChange(e) {
            const {id, value} = e.target;
            setForm(prev => ({...prev, [id]: value}));
        }

        function saveCar(e) {
            e.preventDefault();
            const errors = {};
            if (!form.licensePlateNumber.trim()) errors.licensePlateNumber = "Plate number required";
            if (!form.make.trim()) errors.make = "Make required";
            if (!form.model.trim()) errors.model = "Model required";
            if (!form.year.trim()) errors.year = "Year required";
            setFormErrors(errors);
            if (Object.keys(errors).length > 0) return;

            const method = editingCar ? "PUT" : "POST";
            const url = editingCar ? `${apiCars}/${editingCar.carId}` : apiCars;

            fetch(url, {
                method,
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({...form, year: parseInt(form.year)}),
            })
                .then(res => {
                    if (!res.ok) {
                        return res.text().then(text => {
                            throw new Error(text || "Invalid data");
                        });
                    }
                    fetchCars();
                    closeModal();
                })
                .catch(() => setFormErrors({licensePlateNumber: "Error saving car."}));
        }

        function deleteCar(id) {
            if (!confirm("Delete this car?")) return;
            fetch(`${apiCars}/${id}`, {method: "DELETE"})
                .then(res => {
                    if (!res.ok) throw new Error();
                    fetchCars();
                })
                .catch(() => alert("Failed to delete car."));
        }

        return (
            <div>
                <h1>Car Management System</h1>
                <button onClick={openCreateModal}>Add Car</button>

                <table border="1" cellPadding="8" cellSpacing="0" style={{marginTop: "10px", width: "100%"}}>
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Plate</th>
                        <th>Make</th>
                        <th>Model</th>
                        <th>Year</th>
                        <th>Color</th>
                        <th>Body</th>
                        <th>Engine</th>
                        <th>Transmission</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    {cars.map((car, i) => (
                        <tr key={car.carId}>
                            <td>{i + 1}</td>
                            <td>{car.licensePlateNumber}</td>
                            <td>{car.make}</td>
                            <td>{car.model}</td>
                            <td>{car.year}</td>
                            <td>{car.color}</td>
                            <td>{car.bodyType}</td>
                            <td>{car.engineType}</td>
                            <td>{car.transmission}</td>
                            <td>
                                <button onClick={() => openEditModal(car)}>Edit</button>
                                <button onClick={() => deleteCar(car.carId)}>Delete</button>
                            </td>
                        </tr>
                    ))}
                    </tbody>
                </table>

                {showModal && (
                    <div>
                        <h3>{editingCar ? "Edit Car" : "Add Car"}</h3>
                        <form onSubmit={saveCar}>
                            <div>
                                <label>License Plate:</label><br/>
                                <input id="licensePlateNumber" value={form.licensePlateNumber} onChange={handleChange}/>
                                {formErrors.licensePlateNumber &&
                                    <p style={{color: "red"}}>{formErrors.licensePlateNumber}</p>}
                            </div>
                            <div>
                                <label>Make:</label><br/>
                                <input id="make" value={form.make} onChange={handleChange}/>
                                {formErrors.make && <p style={{color: "red"}}>{formErrors.make}</p>}
                            </div>
                            <div>
                                <label>Model:</label><br/>
                                <input id="model" value={form.model} onChange={handleChange}/>
                                {formErrors.model && <p style={{color: "red"}}>{formErrors.model}</p>}
                            </div>
                            <div>
                                <label>Year:</label><br/>
                                <input id="year" value={form.year} onChange={handleChange}/>
                                {formErrors.year && <p style={{color: "red"}}>{formErrors.year}</p>}
                            </div>
                            <div>
                                <label>Color:</label><br/>
                                <input id="color" value={form.color} onChange={handleChange}/>
                            </div>
                            <div>
                                <label>Body Type:</label><br/>
                                <input id="bodyType" value={form.bodyType} onChange={handleChange}/>
                            </div>
                            <div>
                                <label>Engine Type:</label><br/>
                                <input id="engineType" value={form.engineType} onChange={handleChange}/>
                            </div>
                            <div>
                                <label>Transmission:</label><br/>
                                <input id="transmission" value={form.transmission} onChange={handleChange}/>
                            </div>

                            <button type="submit">{editingCar ? "Update" : "Save"}</button>
                            <button type="button" onClick={closeModal}>Cancel</button>
                        </form>
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
